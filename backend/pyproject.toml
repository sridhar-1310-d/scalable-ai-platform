[project]
name = "scalable-ai-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.117.1",
  "httpx==0.28.1",
  "pydantic==2.11.9",
  "uvicorn==0.36.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
